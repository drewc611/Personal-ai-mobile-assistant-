name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default. Nothing in this workflow writes to the repo, so
# the token cannot. Any job that needs more asks for it explicitly.
permissions:
  contents: read

# A new push supersedes the run in flight. Without this a busy branch queues
# runs that are already answering a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is a moving
      # pointer the action's owner can repoint at any commit; the SHA is the
      # code that was reviewed. Dependabot raises PRs to move them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check errand/ scripts/

      - name: Unit tests
        run: pytest errand/tests/unit

      # The injection suite runs on every push, not nightly. A prompt change
      # that makes the planner more willing is exactly the change that should
      # fail a build.
      - name: Injection suite
        run: pytest errand/tests/injection -m injection

      - name: Acceptance criteria
        run: pytest errand/tests/acceptance -m acceptance

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.5"

      - name: Format check
        run: terraform -chdir=errand/infra fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=errand/infra init -backend=false -input=false
          terraform -chdir=errand/infra validate

  package:
    # Lambda refuses a direct upload over 50MB, and the artifact went 176MB
    # once already by quietly picking up terraform's provider binaries and the
    # agent's dependencies. Finding that out from `terraform apply` costs a
    # round trip; finding it out here costs 40 seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lambda.txt

      - name: Build the Lambda artifact
        run: make -C errand build BIN=$(dirname $(which python))

      - name: Entry points import from the artifact
        working-directory: build/package
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import errand.ingress.handler
          import errand.dispatcher.handler
          import errand.channels.twilio
          import errand.policy.budget
          import errand.tools
          print('all entry points import')
          "

      - name: Nothing that should not ship
        run: |
          set -e
          for pattern in 'errand/tests/' 'errand/infra/' '.terraform' 'strands/' 'bedrock_agentcore/'; do
            if unzip -l build/errand.zip | grep -q "$pattern"; then
              echo "ERROR: $pattern is in the Lambda artifact"; exit 1
            fi
          done
          echo "artifact contents are clean"
