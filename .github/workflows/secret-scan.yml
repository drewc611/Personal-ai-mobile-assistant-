name: Secret scan

# This repository already runs gitleaks in another workflow. This job adds
# the placeholder check, which finds the "change-me" values and secret defaults that
# gitleaks' entropy rules do not consider secrets but that ship auth-bypasses.
# Actions are pinned to a commit SHA so a moved tag cannot change what runs.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Placeholder credentials, secret defaults, debug servers
        run: bash scripts/check-placeholder-secrets.sh
