name: deploy

# Never on a push. A deploy is a decision, so it is made by a person pressing
# the button, and then again by a person approving the environment.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan. Leave false for a plan-only dry run."
        type: boolean
        default: false

permissions:
  contents: read
  # The only extra permission this workflow gets, and the whole point of it:
  # requesting the OIDC token that AWS trades for a session. There is no AWS
  # secret stored anywhere in this repository.
  id-token: write

concurrency:
  # Never two applies at once. Not cancel-in-progress: interrupting terraform
  # mid-apply leaves state and reality disagreeing.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # The trust policy on the role names this environment. A workflow running
    # anywhere else cannot get credentials at all, however it is triggered.
    # Add yourself as a required reviewer and nothing deploys unapproved.
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.5"

      # Fail before touching AWS if the settings that are meant to refuse are
      # still refusing. Cheaper to find out here than half way through apply.
      - name: Preflight the configuration
        run: python scripts/preflight.py errand/infra/terraform.tfvars

      - name: Build the Lambda artifact
        run: make -C errand build BIN=$(dirname $(which python))

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-session-name: errand-deploy-${{ github.run_id }}

      - name: Who are we
        run: aws sts get-caller-identity

      - name: Init
        run: terraform -chdir=errand/infra init -backend-config=backend.hcl -input=false

      - name: Plan
        run: terraform -chdir=errand/infra plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform -chdir=errand/infra apply -input=false -auto-approve tfplan

      - name: What exists now
        if: inputs.apply
        run: terraform -chdir=errand/infra output

      # ------------------------------------------------------------------
      # Wiring the bot. These steps only do anything once the repository
      # secrets exist, so a deploy without them still succeeds and just does
      # not touch the bot.
      # ------------------------------------------------------------------

      - name: Push the Telegram credentials into Secrets Manager
        if: inputs.apply
        env:
          # Read into the environment rather than interpolated into a command,
          # so the value is never a process argument visible in `ps`, and is
          # masked by Actions if anything does print it.
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -e
          if [ -z "$BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN is not set; skipping the bot wiring."
            echo "Add it at Settings > Secrets and variables > Actions."
            exit 0
          fi
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "TELEGRAM_WEBHOOK_SECRET is not set."
            echo "Generate one with: openssl rand -hex 32"
            exit 1
          fi
          umask 077
          jq -nc --arg t "$BOT_TOKEN" --arg s "$WEBHOOK_SECRET" \
            '{bot_token:$t,webhook_secret:$s}' > tg.json
          aws secretsmanager put-secret-value \
            --secret-id errand/telegram \
            --secret-string file://tg.json
          shred -u tg.json
          echo "Telegram credentials stored. They are not printed anywhere."

      - name: Point Telegram at the webhook
        if: inputs.apply
        run: |
          set -e
          # Secrets Manager is the source of truth, not the GitHub secret.
          # The step above populates it when the GitHub secrets are set; if
          # the value was put there by hand instead, this still works. Reading
          # it here rather than taking the GitHub secret is also what keeps
          # the two from disagreeing.
          creds="$(aws secretsmanager get-secret-value \
            --secret-id errand/telegram --query SecretString --output text 2>/dev/null || true)"

          if [ -z "$creds" ]; then
            echo "errand/telegram has no value yet; skipping the webhook."
            echo "Either set the TELEGRAM_* repository secrets or put the"
            echo "value in Secrets Manager, then run this workflow again."
            exit 0
          fi

          BOT_TOKEN="$(printf '%s' "$creds" | jq -r '.bot_token // empty')"
          WEBHOOK_SECRET="$(printf '%s' "$creds" | jq -r '.webhook_secret // empty')"

          # A value read from AWS is not masked the way a GitHub secret is, so
          # mask it explicitly before anything can echo it.
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$WEBHOOK_SECRET"

          if [ -z "$BOT_TOKEN" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "errand/telegram needs both bot_token and webhook_secret."
            echo "The ingress Lambda checks webhook_secret on every update, so"
            echo "a missing one means Telegram is rejected with no reason given."
            exit 1
          fi

          url="$(terraform -chdir=errand/infra output -raw webhook_url)"

          # --data-urlencode keeps the secret out of the URL, so it cannot end
          # up in a proxy log.
          response="$(curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${url}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode "allowed_updates=[\"message\",\"edited_message\",\"callback_query\"]" \
            --data-urlencode "drop_pending_updates=true")"

          echo "$response"
          echo "$response" | jq -e '.ok == true' > /dev/null || {
            echo "setWebhook failed; see the description above."
            exit 1
          }
          echo "Telegram will now deliver updates to ${url}"

      - name: Confirm what Telegram thinks
        if: inputs.apply
        run: |
          set -e
          creds="$(aws secretsmanager get-secret-value \
            --secret-id errand/telegram --query SecretString --output text 2>/dev/null || true)"
          [ -z "$creds" ] && exit 0

          BOT_TOKEN="$(printf '%s' "$creds" | jq -r '.bot_token // empty')"
          echo "::add-mask::$BOT_TOKEN"
          [ -z "$BOT_TOKEN" ] && exit 0

          # getWebhookInfo reports the URL Telegram has and the last delivery
          # error, which is the one thing worth seeing after a deploy.
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" \
            | jq '{url: .result.url,
                   pending: .result.pending_update_count,
                   last_error: .result.last_error_message,
                   last_error_at: .result.last_error_date}'
