[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errand"
version = "0.1.0"
description = "Andrew's personal text and voice agent"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "strands-agents>=0.1",
    "bedrock-agentcore>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["errand*"]

[tool.pytest.ini_options]
testpaths = ["errand/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "acceptance: the v0 acceptance criteria",
    "injection: the hostile-content suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
